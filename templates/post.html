
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{title}} | My Blog</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
            color: #222;
            background: #fafafa;
        }

        h1, h2, h3 {
            line-height: 1.3;
        }

        pre {
            background: #eee;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }

        a {
            color: #1769aa;
        }

        .date {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../">My Blog</a>
        <hr>
    </header>

    <main>
        <article>
            <h1>{{title}}</h1>
            <p class="date">{{date}}</p>

            {{content}}
        </article>
    </main>

    <footer>
        <hr>
        <a href="../../">Back to all posts</a>
    </footer>
</body>
</html>
