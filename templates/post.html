
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{title}} | {{siteName}}</title>
    <meta name="description" content="{{description}}">

    <!-- Link previews when shared on Facebook, WhatsApp, Messenger etc. -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{siteName}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:locale" content="sv_SE">
    <meta property="article:published_time" content="{{date}}">
    <meta name="twitter:card" content="summary">

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
            color: #222;
            background: #fafafa;
        }

        h1, h2, h3 {
            line-height: 1.3;
        }

        pre {
            background: #eee;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }

        a {
            color: #1769aa;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        .date {
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="../../">{{siteName}}</a>
            {{aboutLink}}
        </nav>
        <hr>
    </header>

    <main>
        <article>
            <h1>{{title}}</h1>
            <p class="date"><time datetime="{{date}}">{{displayDate}}</time></p>

            {{content}}
        </article>
    </main>

    <footer>
        <hr>
        <a href="../../">Tillbaka till alla inlägg</a>
    </footer>
</body>
</html>
