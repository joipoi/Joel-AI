
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{title}} | {{siteName}}</title>
    <meta name="description" content="{{description}}">

    <!-- Link previews when shared on Facebook, WhatsApp, Messenger etc. -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{siteName}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:locale" content="sv_SE">
    <meta property="article:published_time" content="{{date}}">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="../../assets/style.css">
    <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{feedUrl}}">
</head>
<body>
    <header>
        <nav>
            <a href="../../">{{siteName}}</a>
        </nav>
        <hr>
    </header>

    <main>
        <article>
            <h1>{{title}}</h1>
            <p class="date"><time datetime="{{date}}">{{displayDate}}</time></p>

            {{content}}
        </article>
    </main>

    <footer>
        <hr>
        <a href="../../">Tillbaka till alla inlägg</a>
    </footer>

    <div id="glossary-popup" class="glossary-popup" role="dialog" hidden></div>

    <script>
        // Clicking a glossary word shows a short explanation instead of leaving
        // the page. Without JavaScript the link just goes to the AI-ordbok.
        (() => {
            const popup = document.getElementById("glossary-popup");
            let openFor = null;

            function close() {
                popup.hidden = true;
                openFor = null;
            }

            function open(link) {
                const label = document.createElement("div");
                label.className = "glossary-label";
                label.textContent = "Från AI-ordboken";

                const title = document.createElement("strong");
                title.textContent = link.dataset.term;

                const definition = document.createElement("p");
                definition.textContent = link.dataset.definition;

                const more = document.createElement("a");
                more.href = link.href;
                more.textContent = "Läs mer i AI-ordboken →";

                popup.replaceChildren(label, title, definition, more);
                popup.hidden = false;
                openFor = link;

                // Place it under the word, but keep it inside the screen.
                const rect = link.getBoundingClientRect();
                const left = Math.max(16, Math.min(
                    rect.left,
                    document.documentElement.clientWidth - popup.offsetWidth - 16
                ));
                popup.style.left = `${left + window.scrollX}px`;
                popup.style.top = `${rect.bottom + window.scrollY + 6}px`;
            }

            document.addEventListener("click", event => {
                const link = event.target.closest("a.glossary-term");

                if (link) {
                    event.preventDefault();
                    openFor === link ? close() : open(link);
                } else if (!popup.contains(event.target)) {
                    close();
                }
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") close();
            });
        })();
    </script>
</body>
</html>
