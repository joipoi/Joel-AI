
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
            color: #222;
            background: #fafafa;
        }

        a {
            color: #1769aa;
        }

        .post {
            padding: 16px 0;
            border-bottom: 1px solid #ddd;
        }

        .date {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <p>My personal blog built with Markdown and Node.js.</p>
    </header>

    <main>
        <h2>All posts</h2>

        {{posts}}
    </main>
</body>
</html>
