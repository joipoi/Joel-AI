
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{siteName}}</title>
    <meta name="description" content="{{description}}">

    <!-- Link previews when shared on Facebook, WhatsApp, Messenger etc. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{siteName}}">
    <meta property="og:title" content="{{siteName}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:locale" content="sv_SE">
    <meta name="twitter:card" content="summary">

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.7;
            color: #222;
            background: #fafafa;
        }

        a {
            color: #1769aa;
        }

        nav {
            display: flex;
            gap: 16px;
        }

        .post {
            padding: 16px 0;
            border-bottom: 1px solid #ddd;
        }

        .post h3, .pinned h3 {
            margin-bottom: 0;
        }

        .date {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        .description {
            margin-top: 4px;
        }

        .pinned {
            background: #eef5fb;
            border-left: 4px solid #1769aa;
            border-radius: 4px;
            padding: 4px 20px;
            margin: 24px 0;
        }

        .pinned-label {
            color: #1769aa;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>{{siteName}}</h1>
        <p>{{description}}</p>
        <nav>{{aboutLink}}</nav>
    </header>

    <main>
        {{pinned}}

        <h2>Alla inlägg</h2>

        {{posts}}
    </main>
    <footer>
          <p>Har du en fråga om AI? Skicka mig ett mail: <a href="mailto:joel@ekne.com">joel@ekne.com</a> </p>
    </footer>
</body>
</html>
