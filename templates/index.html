
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{siteName}}</title>

    <!-- Link previews when shared on Facebook, WhatsApp, Messenger etc. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{siteName}}">
    <meta property="og:title" content="{{siteName}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:locale" content="sv_SE">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="assets/style.css">
    <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{feedUrl}}">
</head>
<body>
    <header>
        <h1>{{siteName}}</h1>
    </header>

    <main>
        {{pinned}}

        <h2>Alla inlägg</h2>

        {{posts}}
    </main>
    <footer>
          <p>Har du en fråga om AI? Skicka mig ett mail: <a href="mailto:joel@ekne.com">joel@ekne.com</a> </p>
    </footer>
</body>
</html>
